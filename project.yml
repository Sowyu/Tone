name: Tone
options:
  bundleIdPrefix: com.gooober
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Tone.xcconfig
  Release: Config/Tone.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Tone:
    type: application
    platform: macOS
    sources:
      - path: Tone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gooober.tone
        PRODUCT_NAME: Tone
        INFOPLIST_FILE: Tone/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tone/Resources/Tone.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SWIFT_STRICT_CONCURRENCY: complete
        DEAD_CODE_STRIPPING: YES
